name: Design Kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, lts/*]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test --prefix skills/hap-compute-design
      - name: Test the packed CLI from outside the checkout
        run: |
          npm pack ./skills/hap-compute-design --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/kit" ./hap-compute-design-*.tgz
          export PATH="$RUNNER_TEMP/kit/bin:$PATH"
          hap-design help
          planner=$(hap-design new)
          node -e 'const fs = require("node:fs"); if (!fs.readFileSync(new URL(process.argv[1]), "utf8").includes("function normalizeBrief")) process.exit(1)' "$planner"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.65.1 @axe-core/playwright@4.14.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify both starter journeys and API states
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node scripts/browser-test.cjs
  package:
    needs: [cli, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build distributable archives
        run: |
          mkdir dist
          npm pack ./skills/hap-compute-design --pack-destination dist
          tar -czf dist/hap-compute-design-skill.tar.gz -C skills hap-compute-design
          cd dist
          sha256sum *.tgz *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hap-compute-design
          path: dist/
