<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бриф сайта · HAP Design Kit</title>
<style>
*{box-sizing:border-box}body{margin:auto;max-width:760px;padding:24px;font:16px/1.5 Inter,system-ui,sans-serif;background:#faf9f6;color:#262824}h1{letter-spacing:-.045em;font-size:clamp(32px,6vw,52px)}fieldset{border:0;border-top:1px solid #c6c8c0;margin:24px 0;padding:14px 0}legend{font-size:1.35rem;font-weight:650}label{display:block;margin:12px 0}input,select,button,textarea{display:block;width:100%;padding:10px;font:inherit;border:1px solid #8b9087;border-radius:5px;background:white;color:inherit}button{background:#244e40;color:white;cursor:pointer}#sample{padding:24px;margin-top:20px;border:1px solid #bbb;border-left:6px solid var(--accent);background:var(--paper);color:var(--ink)}#sample strong{font-size:1.5em}#sample small{color:var(--accent)}[hidden]{display:none}
</style><main><h1>Бриф сайта</h1><form>
<fieldset><legend>Задача</legend>
<label>Как называется проект?<input name="project" required></label>
<label>Кто будет пользоваться сайтом?<input name="audience" placeholder="Например, клиенты, ожидающие доставку" required></label>
<label>Что человек должен сделать в первую очередь?<input name="task" placeholder="Узнать, когда приедет заказ" required></label>
<label>Какие разделы нужны?<input name="pages" placeholder="Заказы, история, помощь"></label></fieldset>
<fieldset><legend>Данные и вход</legend>
<label>Откуда брать информацию?<select name="source"><option>Самостоятельный сайт</option><option>Из приложения HAP</option></select></label>
<label id="appLabel" hidden>Какое приложение подключаем?<select name="app" disabled required><option value="">Выберите из списка</option><!-- APPS --></select><small id="appHint"></small></label>
<label>Кому доступен сайт?<select name="access"><option>Всем без входа</option><option>Сотрудникам через учётную запись организации</option><option>Приглашённым пользователям по учётной записи</option><option>Публичная часть и личный кабинет</option></select></label>
<label>Что посетитель может видеть и делать после входа?<input name="permissions" placeholder="Например, видеть только свои заказы"></label></fieldset>
<fieldset id="appearance"><legend>Оформление</legend>
<label>Какое настроение ближе?<select name="style"><option>Спокойное деловое</option><option>Тёплое редакционное</option><option>Контрастное тёмное</option></select></label>
<label>Какой шрифт удобнее читать?<select name="font"><option>Системный без засечек</option><option>С засечками</option><option>Моноширинный</option></select></label>
<label>Сколько информации показать сразу?<select name="density"><option>Свободно</option><option>Компактно</option></select></label>
<article id="sample" aria-label="Образец оформления"><small>Ожидает отправки</small><br><strong>Заказ 1048</strong><div>Получение завтра, 14:00–16:00</div></article>
<label>Какие цвета, логотип или примеры уже есть?<input name="brand"></label></fieldset>
<fieldset><legend>Условия использования</legend>
<label>Где сайт будут открывать чаще?<select name="device"><option>На телефоне и компьютере</option><option>На телефоне</option><option>На компьютере</option></select></label>
<label>Какие языки нужны?<input name="languages" value="Русский"></label>
<label>Что особенно важно для удобства?<textarea name="needs" placeholder="Крупный текст, работа с клавиатуры, медленный интернет…"></textarea></label>
<label>По какой задаче проверим готовность?<input name="acceptance" placeholder="Клиент с телефона находит дату доставки своего заказа" required></label></fieldset>
<button>Скачать бриф проекта</button></form></main>
<script>
const form=document.querySelector('form'), fields=form.elements, sample=document.querySelector('#sample');
const palettes=[['#ffffff','#172d24','#276447'],['#fff1da','#3d2e22','#864419'],['#192631','#f0f5fa','#95dbef']];
function refresh(){
  const connected=fields.source.selectedIndex===1;
  document.querySelector('#appLabel').hidden=!connected;
  fields.app.disabled=!connected;
  document.querySelector('#appHint').textContent=fields.app.options.length>1?'Показаны приложения, владельцем которых вы являетесь.':'Для загрузки списка запустите hap-design new с параметрами --org и --origin и персональным токеном в окружении.';
  const palette=palettes[fields.namedItem('style').selectedIndex];
  ['--paper','--ink','--accent'].forEach((key,i)=>sample.style.setProperty(key,palette[i]));
  sample.style.fontFamily=['system-ui','Georgia, serif','monospace'][fields.font.selectedIndex];
  sample.style.padding=fields.density.selectedIndex?'10px':'24px';
}
form.addEventListener('change',refresh);refresh();
form.addEventListener('submit',event=>{
  event.preventDefault();
  const brief=Object.fromEntries(new FormData(form));
  if(brief.app) brief.appName=fields.app.selectedOptions[0].textContent;
  const url=URL.createObjectURL(new Blob([JSON.stringify(brief,null,2)],{type:'application/json'}));
  const link=document.createElement('a');link.href=url;link.download='design-brief.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
</script></html>
