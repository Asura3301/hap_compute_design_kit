<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website brief · HAP Design Kit</title>
<style>
*{box-sizing:border-box}body{margin:auto;max-width:760px;padding:24px;font:16px/1.5 Inter,system-ui,sans-serif;background:#faf9f6;color:#262824}h1{letter-spacing:-.045em;font-size:clamp(32px,6vw,52px)}fieldset{border:0;border-top:1px solid #c6c8c0;margin:24px 0;padding:14px 0}legend{font-size:1.35rem;font-weight:650}label{display:block;margin:12px 0}input,select,button,textarea{display:block;width:100%;padding:10px;font:inherit;border:1px solid #8b9087;border-radius:5px;background:white;color:inherit}button{background:#244e40;color:white;cursor:pointer}#sample{padding:var(--space);margin-top:20px;border:1px solid #bbb;border-left:6px solid var(--accent);background:var(--panel);color:var(--ink);font-family:var(--typeface)}#sample strong{font-size:1.5em}#sample small{color:var(--accent)}[hidden]{display:none}
</style><main><h1>Website brief</h1><p>Choose a direction, preview it and save a brief for your coding agent.</p>
<label>Reopen an existing brief<input id="import" type="file" accept=".json,application/json"></label>
<p id="message" role="status"></p>
<form>
<fieldset><legend>Project goals</legend>
<label>What is the project called?<input name="project" required></label>
<label>Who will use the site?<input name="audience" placeholder="Customers waiting for a delivery" required></label>
<label>What should visitors be able to do first?<input name="task" placeholder="Find their delivery date" required></label>
<label>Which pages do you need?<input name="pages" placeholder="Orders, history, help"></label></fieldset>
<fieldset><legend>Data and access</legend>
<label>Where does the information come from?<select name="source"><option value="standalone">Standalone website</option><option value="hap">Existing HAP app</option></select></label>
<label id="appLabel" hidden>Which application should the site use?<select name="app" disabled required><option value="">Choose an application</option><!-- APPS --></select><small id="appHint" data-discovery="false"></small></label>
<label>Who can access the site?<select name="access"><option value="public">Anyone without signing in</option><option value="organization">Employees with an organization account</option><option value="invited">Invited users with an account</option><option value="mixed">Public pages and a private area</option></select></label>
<label>What can visitors see and do after signing in?<input name="permissions" placeholder="View their own orders"></label></fieldset>
<fieldset id="appearance"><legend>Appearance</legend>
<label>Which style fits the site?<select name="style"><option value="business">Business</option><option value="editorial">Editorial</option><option value="dark">Dark</option></select></label>
<label>Which typeface suits the content?<select name="font"><option value="sans">System sans serif</option><option value="serif">Serif</option><option value="mono">Monospace</option></select></label>
<label>How much information should fit on screen?<select name="density"><option value="roomy">Spacious</option><option value="compact">Compact</option></select></label>
<article id="sample" aria-label="Style preview"><small>Awaiting dispatch</small><br><strong>Order 1048</strong><div>Pickup tomorrow, 14:00–16:00</div></article>
<label>Do you have brand colors, a logo or examples?<input name="brand"></label></fieldset>
<fieldset><legend>Devices and usability</legend>
<label>Where will people use the site?<select name="device"><option value="both">Phone and desktop</option><option value="phone">Mostly on a phone</option><option value="desktop">Mostly on desktop</option></select></label>
<label>Which languages should the site support?<input name="languages" value="English"></label>
<label>What would make the site easier to use?<textarea name="needs" placeholder="Larger text, keyboard access, slow connection…"></textarea></label>
<label>What should we test before launch?<input name="acceptance" placeholder="A customer can find their delivery date on a phone" required></label></fieldset>
<button type="button" id="preview">Preview screen plan</button><p id="plan" role="status"></p><button>Download design brief</button></form></main>
<script src="brief.js"></script>
<script>
const form=document.querySelector('form'), fields=form.elements, sample=document.querySelector('#sample');
function refresh(){
  const connected=fields.source.selectedIndex===1;
  document.querySelector('#appLabel').hidden=!connected;
  fields.app.disabled=!connected;
  document.querySelector('#appHint').textContent=document.querySelector('#appHint').dataset.discovery === 'true'
    ? (Array.from(fields.app.options).some(option => option.value && !option.dataset.originalName) ? 'Applications scoped to your current ownership.' : 'No owned applications were returned for this organization.')
    : 'To discover apps, run hap-design new with --org, --origin and HAP_PAT in your environment. Imported choices have not been verified.';
  const tokens = designTokens({style: fields.namedItem('style').value, font: fields.font.value, density: fields.density.value});
  for (const [key, value] of Object.entries(tokens)) sample.style.setProperty('--' + key, value);
}
const message = document.querySelector('#message');
const plan = document.querySelector('#plan');
function collectBrief() {
  const brief = Object.fromEntries(new FormData(form));
  if (brief.app) brief.appName = fields.app.selectedOptions[0].dataset.originalName || fields.app.selectedOptions[0].textContent;
  return normalizeBrief({version: 1, ...brief});
}
form.addEventListener('change', refresh);
form.addEventListener('input', () => { plan.textContent = ''; });
refresh();
document.querySelector('#import').addEventListener('change', async event => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    if (file.size > 128000) throw Error('This file is too large for a design brief.');
    const brief = normalizeBrief(JSON.parse(await file.text()));
    if (brief.app && !Array.from(fields.app.options).some(option => option.value === brief.app)) {
      fields.app.add(new Option(brief.appName + ' (from brief)', brief.app));
      fields.app.lastElementChild.dataset.originalName = brief.appName;
    }
    form.reset();
    for (const [key, value] of Object.entries(brief)) {
      const field = fields.namedItem(key);
      if (field) field.value = value;
    }
    refresh();
    plan.textContent = '';
    message.textContent = 'Brief loaded. Review the settings and download to save changes.';
  } catch (error) {
    message.textContent = 'Could not open brief. ' + error.message;
  } finally {
    event.target.value = '';
  }
});
document.querySelector('#preview').addEventListener('click', () => {
  if (!form.reportValidity()) return;
  try {
    const brief = collectBrief();
    plan.textContent = [
      'Audience: ' + brief.audience,
      'Primary task: ' + brief.task,
      'Screens: ' + (brief.pages || 'Start with the primary task'),
      'Launch test: ' + brief.acceptance,
    ].join(' · ');
    message.textContent = '';
  } catch (error) {
    message.textContent = error.message;
  }
});
form.addEventListener('submit',event=>{
  event.preventDefault();
  let brief;
  try {
    brief = collectBrief();
  } catch (error) {
    message.textContent = error.message;
    return;
  }
  const url=URL.createObjectURL(new Blob([JSON.stringify(brief,null,2)],{type:'application/json'}));
  const link=document.createElement('a');link.href=url;link.download='design-brief.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
</script></html>
