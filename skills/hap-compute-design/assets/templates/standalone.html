<!doctype html>
<html lang="en">
<meta charset="utf-8">

<title>Depot Visitor Center</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="theme.css">
<main>
  <header>
    <p class="eyebrow">Visitor information</p>
    <h1>Depot Visitor Center</h1>

    <a class="button" href="#hours">See opening hours</a>

  <section id="hours" aria-labelledby="hours-title">
    <h2 id="hours-title">Opening hours</h2>
    <dl>
      <dt>Tuesday to Friday</dt><dd>10:00–17:00</dd>
      <dt>Saturday and Sunday</dt><dd>09:00–16:00</dd>
      <dt>Monday</dt><dd>Closed</dd>
    </dl>
  </section>
